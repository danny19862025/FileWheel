[package]
name = "filewheel"
version = "0.1.0"
edition = "2024"
description = "A local drag-and-drop file converter for Linux"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "=0.10.3", features = ["v4_10"] }
serde_json = "1"
pango = { version = "0.21", features = ["v1_56"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Embeds the application icon and version info into FileWheel.exe; build.rs
# only uses it when the target is Windows.
winresource = "0.1"

[profile.release]
opt-level = "s"
strip = true
