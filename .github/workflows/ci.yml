name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Install build and conversion engines
        run: >-
          pacman -Syu --noconfirm --needed
          git rust gtk4 gtk4-layer-shell imagemagick libheif ffmpeg
          libreoffice-fresh poppler libarchive python qpdf ttf-dejavu

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Create an unprivileged test user
        run: |
          useradd --create-home filewheel-ci
          chown -R filewheel-ci:filewheel-ci "$GITHUB_WORKSPACE"

      - name: Check formatting, regressions, and real conversions
        env:
          CARGO_TERM_COLOR: always
        run: |
          runuser -u filewheel-ci -- env HOME=/home/filewheel-ci bash -euc '
            cargo fmt --check
            cargo test --locked
            python3 tests/formats_test.py
            cargo build --locked
            target/debug/filewheel --self-test
          '

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install MSYS2 UCRT64 toolchain, GTK and test engines
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: UCRT64
          update: true
          install: zip
          pacboy: >-
            gtk4:p rust:p pkgconf:p gcc:p imagemagick:p python:p

      - name: Run tests
        env:
          CARGO_TERM_COLOR: always
        run: |
          cargo test --locked
          python tests/formats_test.py

      - name: Run the GUI smoke test and capture a screenshot
        run: |
          cargo build --locked
          FILEWHEEL_SCREENSHOT="$PWD/filewheel-windows.png" target/debug/filewheel.exe --smoke-test

      - name: Build the portable ZIP
        run: |
          cargo build --release --locked
          bash packaging/windows/package.sh

      - name: Check the ZIP runs without MSYS2
        shell: pwsh
        run: |
          Expand-Archive dist/FileWheel-windows-x86_64.zip -DestinationPath zipcheck
          # Only Windows' own folders: every other DLL must come from the ZIP.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $exe = "zipcheck\FileWheel\FileWheel.exe"
          $help = Start-Process $exe -ArgumentList '--help' -PassThru -Wait
          if ($help.ExitCode -ne 0) { throw "FileWheel.exe --help exited with $($help.ExitCode)" }
          $app = Start-Process $exe -ArgumentList '--background' -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "FileWheel.exe exited early with $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Installing Inno Setup failed" }
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          & $iscc "/DAppVersion=$version" packaging\windows\FileWheel.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }

      - name: Check the installer installs, runs and uninstalls
        shell: pwsh
        run: |
          $setup = Start-Process dist\FileWheel-Setup-x86_64.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Setup exited with $($setup.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\FileWheel"
          $exe = "$dir\FileWheel.exe"
          if (-not (Test-Path $exe)) { throw "FileWheel.exe was not installed to $dir" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\FileWheel.lnk")) { throw "Start menu shortcut missing" }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $app = Start-Process $exe -ArgumentList '--background' -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "Installed FileWheel.exe exited early with $($app.ExitCode)" }
          $uninstall = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $exe) { throw "FileWheel.exe is still present after uninstall" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FileWheel-windows-x86_64
          path: |
            dist/FileWheel-windows-x86_64.zip
            dist/FileWheel-Setup-x86_64.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-screenshot
          path: filewheel-windows.png
          if-no-files-found: ignore

  windows-release:
    # Attach the Windows installer and ZIP to a GitHub release when a v* tag is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FileWheel-windows-x86_64
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum FileWheel-Setup-x86_64.exe FileWheel-windows-x86_64.zip > FileWheel-windows-SHA256SUMS.txt
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "FileWheel $TAG" --generate-notes
          fi
          gh release upload "$TAG" FileWheel-Setup-x86_64.exe FileWheel-windows-x86_64.zip \
            FileWheel-windows-SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
